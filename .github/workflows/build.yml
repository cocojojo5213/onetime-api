name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            linux: true
            deb_arch: amd64
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: "--bundles deb,appimage"
            linux: true
            deb_arch: arm64
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis,msi"
          - name: macOS Universal
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.linux == true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('onetime-api {0}', github.ref_name) || '' }}
          releaseBody: |
            ### Download / 下载
            - **Ubuntu / Debian:** `.deb` packages are available as `amd64` for x86_64 systems and `arm64` for ARM64 systems.
            - **Portable Linux:** AppImages are published as `amd64` and `aarch64`. Browser downloads generally require `chmod +x <file>.AppImage` before the first launch.
            - **Windows:** the `setup.exe` asset is the standard installer. **macOS:** the universal `.dmg` supports Intel and Apple Silicon.
            - Versions with the signed updater can download, verify, install, and restart directly inside the application.
          releaseDraft: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify Linux package architecture
        if: matrix.linux == true
        shell: bash
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          actual_arch="$(dpkg-deb --field "$deb" Architecture)"
          test "$actual_arch" = "${{ matrix.deb_arch }}"

  publish:
    name: Publish completed Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$tmp"
          version="${GITHUB_REF_NAME#v}"
          jq -e --arg version "$version" '
            . as $manifest |
            $manifest.version == $version and
            ([
              "linux-x86_64-deb",
              "linux-x86_64-appimage",
              "linux-aarch64-deb",
              "linux-aarch64-appimage",
              "windows-x86_64-nsis",
              "windows-x86_64-msi",
              "darwin-x86_64-app",
              "darwin-aarch64-app"
            ] | all(. as $target |
              ($manifest.platforms[$target].url | startswith("https://")) and
              ($manifest.platforms[$target].signature | length > 0)
            ))
          ' "$tmp/latest.json"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
