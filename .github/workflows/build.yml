name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            linux: true
            deb_arch: amd64
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: "--bundles deb,appimage"
            linux: true
            deb_arch: arm64
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis,msi"
          - name: macOS Universal
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.linux == true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('onetime-api {0}', github.ref_name) || '' }}
          releaseBody: |
            ### Download / 下载
            - **Ubuntu / Debian:** `.deb` packages are available as `amd64` for x86_64 systems and `arm64` for ARM64 systems.
            - **Portable Linux:** AppImages are published as `amd64` and `aarch64`. Browser downloads generally require `chmod +x <file>.AppImage` before the first launch.
            - **Windows:** the `setup.exe` asset is the standard installer. **macOS:** the universal `.dmg` supports Intel and Apple Silicon.
            - The application checks GitHub Releases automatically; installation remains user-confirmed.
          releaseDraft: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: Verify Linux package architecture
        if: matrix.linux == true
        shell: bash
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          actual_arch="$(dpkg-deb --field "$deb" Architecture)"
          test "$actual_arch" = "${{ matrix.deb_arch }}"
