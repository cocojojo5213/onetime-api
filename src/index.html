<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OneTime API</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <!-- Icon paths are from Lucide (ISC License). -->
    <svg class="icon-sprite" aria-hidden="true">
      <defs>
        <symbol id="icon-dashboard" viewBox="0 0 24 24">
          <rect width="7" height="9" x="3" y="3" rx="1" />
          <rect width="7" height="5" x="14" y="3" rx="1" />
          <rect width="7" height="9" x="14" y="12" rx="1" />
          <rect width="7" height="5" x="3" y="16" rx="1" />
        </symbol>
        <symbol id="icon-bot" viewBox="0 0 24 24">
          <path d="M12 8V4H8" />
          <rect width="16" height="12" x="4" y="8" rx="2" />
          <path d="M2 14h2M20 14h2M9 13v2M15 13v2" />
        </symbol>
        <symbol id="icon-shield-check" viewBox="0 0 24 24">
          <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z" />
          <path d="m9 12 2 2 4-4" />
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5v14" />
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9" />
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </symbol>
        <symbol id="icon-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </symbol>
        <symbol id="icon-x" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12" />
        </symbol>
        <symbol id="icon-link" viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </symbol>
        <symbol id="icon-play" viewBox="0 0 24 24">
          <path d="m6 3 14 9-14 9z" />
        </symbol>
        <symbol id="icon-pencil" viewBox="0 0 24 24">
          <path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.36a.5.5 0 0 0 .62.62L7 20.66a2 2 0 0 0 .83-.5z" />
          <path d="m15 5 4 4" />
        </symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5" />
        </symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10" />
        </symbol>
        <symbol id="icon-folder" viewBox="0 0 24 24">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z" />
        </symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24">
          <path d="M2.06 12.35a1 1 0 0 1 0-.7C3.7 7.6 7.6 5 12 5c4.4 0 8.3 2.6 9.94 6.65a1 1 0 0 1 0 .7C20.3 16.4 16.4 19 12 19c-4.4 0-8.3-2.6-9.94-6.65" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="icon-eye-off" viewBox="0 0 24 24">
          <path d="m2 2 20 20M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.24A9.7 9.7 0 0 1 12 4c4.4 0 8.3 2.6 9.94 6.65a1 1 0 0 1 0 .7 10.7 10.7 0 0 1-2.12 3.19M6.61 6.61a10.7 10.7 0 0 0-4.55 5.04 1 1 0 0 0 0 .7C3.7 16.4 7.6 19 12 19a9.7 9.7 0 0 0 2.1-.24" />
        </symbol>
        <symbol id="icon-terminal" viewBox="0 0 24 24">
          <path d="m4 17 6-6-6-6M12 19h8" />
        </symbol>
        <symbol id="icon-save" viewBox="0 0 24 24">
          <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
          <path d="M17 21v-8H7v8M7 3v5h8" />
        </symbol>
        <symbol id="icon-circle-check" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        </symbol>
        <symbol id="icon-circle-alert" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4M12 16h.01" />
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 0 1-15.2 6.5L3 16" />
          <path d="M3 21v-5h5M3 12A9 9 0 0 1 18.2 5.5L21 8" />
          <path d="M21 3v5h-5" />
        </symbol>
        <symbol id="icon-external-link" viewBox="0 0 24 24">
          <path d="M15 3h6v6M10 14 21 3" />
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </symbol>
        <symbol id="icon-download" viewBox="0 0 24 24">
          <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
        </symbol>
      </defs>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <img src="assets/app-icon.png" alt="" class="brand-icon" />
          <div class="brand-copy">
            <strong>OneTime</strong>
            <span>API</span>
          </div>
        </div>

        <nav class="side-nav">
          <button type="button" class="nav-item active" aria-current="page">
            <svg class="icon"><use href="#icon-dashboard"></use></svg>
            <span>API 配置</span>
            <span id="nav-count" class="nav-count">0</span>
          </button>
          <button type="button" id="btn-agents" class="nav-item">
            <svg class="icon"><use href="#icon-bot"></use></svg>
            <span>Agent 模板</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button type="button" id="version-button" class="version-button" title="查看版本与更新">
            <svg class="icon"><use href="#icon-refresh"></use></svg>
            <span class="version-copy">
              <strong id="version-label">版本信息</strong>
              <span id="version-summary">正在读取版本</span>
            </span>
            <span id="update-indicator" class="update-indicator" aria-label="有新版本" hidden></span>
          </button>

          <div class="sidebar-status">
            <div class="status-mark">
              <svg class="icon"><use href="#icon-shield-check"></use></svg>
            </div>
            <div>
              <strong>本地模式</strong>
              <span>配置仅保存在此设备</span>
            </div>
          </div>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div class="page-title">
            <span>连接管理</span>
            <h1>API 配置</h1>
          </div>
          <div class="topbar-actions">
            <button type="button" id="theme-toggle" class="icon-button" aria-label="切换深色主题" title="切换深色主题">
              <svg class="icon"><use href="#icon-moon"></use></svg>
            </button>
            <button type="button" id="btn-add" class="primary-button">
              <svg class="icon"><use href="#icon-plus"></use></svg>
              <span>新增配置</span>
            </button>
          </div>
        </header>

        <main class="content">
          <section class="profile-section" aria-labelledby="profile-heading">
            <div class="list-toolbar">
              <div>
                <h2 id="profile-heading">已保存的连接</h2>
                <p id="profile-count">0 个配置</p>
              </div>
              <div class="search-control" role="search">
                <label class="sr-only" for="profile-search">搜索配置</label>
                <svg class="icon"><use href="#icon-search"></use></svg>
                <input id="profile-search" type="search" placeholder="搜索名称或地址" autocomplete="off" />
                <button type="button" id="clear-search" class="search-clear" aria-label="清空搜索" title="清空搜索" hidden>
                  <svg class="icon"><use href="#icon-x"></use></svg>
                </button>
              </div>
            </div>

            <div id="profile-list" class="profile-list" role="list"></div>

            <div id="empty-state" class="empty-state" hidden>
              <div class="empty-symbol">
                <svg class="icon"><use href="#icon-link"></use></svg>
              </div>
              <h2>还没有 API 配置</h2>
              <p>添加第一条临时连接，之后可以直接从这里启动。</p>
              <button type="button" id="empty-add" class="secondary-button">
                <svg class="icon"><use href="#icon-plus"></use></svg>
                <span>添加配置</span>
              </button>
            </div>

            <div id="no-results" class="empty-state compact" hidden>
              <div class="empty-symbol">
                <svg class="icon"><use href="#icon-search"></use></svg>
              </div>
              <h2>没有匹配的配置</h2>
              <p>换一个名称或地址试试。</p>
            </div>
          </section>
        </main>
      </section>
    </div>

    <dialog id="profile-dialog" class="modal">
      <form id="profile-form" method="dialog">
        <header class="modal-header">
          <div class="modal-heading">
            <span>连接详情</span>
            <h2 id="profile-dialog-title">新增配置</h2>
          </div>
          <button type="button" id="profile-close" class="icon-button" aria-label="关闭" title="关闭">
            <svg class="icon"><use href="#icon-x"></use></svg>
          </button>
        </header>

        <div class="modal-body">
          <div class="form-grid">
            <label class="field">
              <span class="field-label">名称</span>
              <input name="name" required placeholder="例如：某中转-0726" autocomplete="off" />
            </label>

            <label class="field">
              <span class="field-label">Agent</span>
              <select name="agent_id" id="agent-select" required></select>
            </label>

            <label class="field full-width">
              <span class="field-label">Base URL</span>
              <div class="input-with-icon">
                <svg class="icon"><use href="#icon-globe"></use></svg>
                <input name="base_url" type="url" inputmode="url" required placeholder="https://api.example.com" autocomplete="url" spellcheck="false" />
              </div>
            </label>

            <label class="field full-width">
              <span class="field-label">API Key</span>
              <div class="input-with-icon key-input">
                <svg class="icon"><use href="#icon-shield-check"></use></svg>
                <input name="api_key" type="password" required placeholder="sk-..." autocomplete="off" spellcheck="false" />
                <button type="button" id="toggle-key" class="input-action" aria-label="显示 API Key" title="显示 API Key">
                  <svg class="icon"><use href="#icon-eye"></use></svg>
                </button>
              </div>
            </label>

            <label class="field full-width">
              <span class="field-label">工作目录 <small>可选</small></span>
              <div class="input-with-icon">
                <svg class="icon"><use href="#icon-folder"></use></svg>
                <input name="workdir" placeholder="留空使用默认目录" autocomplete="off" spellcheck="false" />
              </div>
            </label>
          </div>
        </div>

        <footer class="modal-actions">
          <button type="button" class="text-button" id="profile-cancel">取消</button>
          <button type="submit" class="primary-button">
            <svg class="icon"><use href="#icon-save"></use></svg>
            <span>保存配置</span>
          </button>
        </footer>
      </form>
    </dialog>

    <dialog id="agents-dialog" class="modal agents-modal">
      <div class="agents-body">
        <header class="modal-header">
          <div class="modal-heading">
            <span>启动设置</span>
            <h2>Agent 模板</h2>
          </div>
          <button type="button" id="agents-close-icon" class="icon-button" aria-label="关闭" title="关闭">
            <svg class="icon"><use href="#icon-x"></use></svg>
          </button>
        </header>

        <div class="modal-body agents-content">
          <div class="template-tokens">
            <span>可用占位符</span>
            <code>{base_url}</code>
            <code>{api_key}</code>
          </div>
          <div id="agents-list" class="agents-list"></div>
        </div>

        <footer class="modal-actions split-actions">
          <button type="button" class="secondary-button" id="agent-new">
            <svg class="icon"><use href="#icon-plus"></use></svg>
            <span>新模板</span>
          </button>
          <div>
            <button type="button" class="text-button" id="agents-close">取消</button>
            <button type="button" id="agents-save" class="primary-button">
              <svg class="icon"><use href="#icon-save"></use></svg>
              <span>保存全部</span>
            </button>
          </div>
        </footer>
      </div>
    </dialog>

    <dialog id="update-dialog" class="modal update-modal">
      <div class="update-body">
        <header class="modal-header">
          <div class="modal-heading">
            <span>应用更新</span>
            <h2>版本信息</h2>
          </div>
          <button type="button" id="update-close-icon" class="icon-button" aria-label="关闭" title="关闭">
            <svg class="icon"><use href="#icon-x"></use></svg>
          </button>
        </header>

        <div class="modal-body update-content">
          <div class="version-grid">
            <div>
              <span>当前版本</span>
              <strong id="current-version">读取中</strong>
            </div>
            <div>
              <span>最新版本</span>
              <strong id="latest-version">检查中</strong>
            </div>
          </div>
          <div id="update-message" class="update-message" role="status" aria-live="polite">
            正在检查已签名的更新清单。
          </div>
          <div id="update-progress" class="update-progress" aria-live="polite" hidden>
            <div class="update-progress-track" aria-hidden="true">
              <span id="update-progress-bar"></span>
            </div>
            <span id="update-progress-label">准备下载</span>
          </div>
          <p class="update-note">更新包会先在本地验证发布签名。Linux <code>.deb</code> 安装时，系统会请求管理员权限。</p>
        </div>

        <footer class="modal-actions split-actions">
          <button type="button" id="update-check" class="secondary-button">
            <svg class="icon"><use href="#icon-refresh"></use></svg>
            <span>重新检查</span>
          </button>
          <div>
            <button type="button" id="update-close" class="text-button">关闭</button>
            <button type="button" id="update-download" class="primary-button">
              <svg class="icon"><use href="#icon-download"></use></svg>
              <span>检查后安装</span>
            </button>
          </div>
        </footer>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <svg class="icon"><use href="#icon-circle-check"></use></svg>
      <span></span>
    </div>
  </body>
</html>
